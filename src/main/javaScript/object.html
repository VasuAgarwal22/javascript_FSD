<body>
   <script>
       const add = (x,y) =>{
           return x + y;
       }
       const sub = (x,y) =>{
           return x - y;
       }
       const mul = (x,y) =>{
           return x * y;
       }
       const div = (x,y) =>{
           return x / y;
       }
       console.log(add(10,20));
       console.log(sub(10,20));
       console.log(mul(10,20));
       console.log(div(12,4));
   </script>
</body>
